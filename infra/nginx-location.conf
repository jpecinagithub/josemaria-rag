# Bloque nginx (host, site mi-gps de jpecina.duckdns.org) para josemaria-rag.
# El backend sirve en 127.0.0.1:8100 tanto la API (/api/*) como el frontend
# compilado; este location publica ambos bajo /josemaria-rag/.
# Añadir junto a los demás location del server{} (hay una copia de seguridad
# previa del fichero en /etc/nginx/backups/).

location = /josemaria-rag { return 301 /josemaria-rag/; }
location /josemaria-rag/ {
    # JOSEMARIA-RAG — RAG spec v1.0 (proyecto independiente de /josemaria/)
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 2m;
}
